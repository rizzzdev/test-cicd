services:
  app:
    image: ${DOCKERHUB_USERNAME}/test-cicd:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - PORT=3022
      - NODE_ENV=production
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.cicd.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.cicd.entrypoints=websecure"
      - "traefik.http.routers.cicd.tls.certresolver=myresolver"
      - "traefik.http.routers.cicd.priority=1"
      - "traefik.http.services.cicd.loadbalancer.server.port=3022"

networks:
  proxy:
    external: true
